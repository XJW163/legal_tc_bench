[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-tc-bench"
version = "1.8.1"
description = "Definition-grounded terminology consistency control and evaluation for long legal document translation."
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "requests>=2.31",
  "tenacity>=8.2",
  "tqdm>=4.66",
  "openai>=1.30",
  "httpx>=0.27",
]

[project.scripts]
legal-tc = "legal_tc_bench.cli:main"

[tool.setuptools.packages.find]
include = ["legal_tc_bench*"]
